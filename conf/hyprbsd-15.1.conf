# HyprBSD 15.1, amd64. HyprBSD (https://hyprbsd.org/) is FreeBSD 15.1 with a
# preconfigured Hyprland desktop. Upstream builds amd64 only and publishes
# one installer ISO per release -- no VM image -- so this is the ISO path
# with no arch variants.
#
# VM_RELEASE is the bare FreeBSD-style version ("15.1"), while the URL
# still pins release-candidate media (15.1-rc3 is the newest ISO upstream
# has published; there is no final 15.1 yet). When the final ISO appears,
# hooks/upstream_check.py reports "15.1" and the upstream watcher rewrites
# the "15.1-rc<n>" token in VM_ISO_LINK to "15.1" in place -- the same RC ->
# final refresh netbsd-builder used for 11.0 -- so the image name and the
# user-facing `--release 15.1` never change.
VM_ISO_LINK="https://download.hyprbsd.org/hyprbsd-15.1-rc3.iso"
VM_OS_NAME="hyprbsd"
VM_SSH_PORT=2222
VM_RELEASE=15.1

# UEFI firmware for every boot of the build. HyprBSD's installer lays down
# an EFI system partition and no BIOS boot code at all (install-disk:
# efi + swap + zfs; install-boot copies loader.efi to EFI/BOOT/BOOTX64.EFI
# and creates no firmware boot entry), so SeaBIOS cannot boot the installed
# disk. The combined OVMF image via -bios keeps no NVRAM between QEMU runs;
# that is fine because the ESP carries the removable-media fallback path
# that OVMF always tries. hooks/host_beforeBuild.py installs the ovmf
# package and fails the build if this file is still missing.
#
# Under OVMF the console out list includes the serial port, so FreeBSD's
# loader picks "Dual (Serial primary)" on its own: the live ISO and the
# installed system both put a getty on ttyu0 with no loader.conf edits.
# That is what lets this whole build run over the serial chardev.
VM_BIOS="/usr/share/ovmf/OVMF.fd"

# The unattended-install answers. HyprBSD's live system looks for a drive
# labelled CIDATA holding hyprbsd.conf and, when it finds one, installs
# without asking anything and powers off. hooks/host_beforeBuild.py builds
# this ISO; build.py attaches VM_SEED_ISO as a second CD on every boot
# (data only, never in the boot order).
VM_SEED_ISO="build/hyprbsd-cidata.iso"

# Installed-system login banner on the serial console. /etc/gettytab
# substitutes the hostname into the line, so match the unchanging suffix.
VM_LOGIN_TAG="(ttyu0)"

# The answer file sets this root password; build.py's console branch types
# it at the ttyu0 login to paste enablessh.local.
VM_ROOT_PASSWORD="anyvm.org"

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"

VM_INSTALL_CMD="pkg install -y "

# rsync is already part of HyprBSD's desktop package set; listing it keeps
# build.py's post-export check honest. sshfs is not installed by upstream.
VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fusefs-sshfs"

VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"

VM_NIC=virtio

# The whole build is driven over the serial chardev; no VNC, no OCR.
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# No VM_OPTS: hooks/host_installOpts.py watches the unattended install
# (mirrored to ttyu0 by HyprBSD's own launcher) in place of the OCR-driven
# processOpts(VM_OPTS) path.

VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
